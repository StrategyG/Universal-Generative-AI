[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-generative-ai"
version = "0.1.0"
description = "Modular API and orchestration layer for multimodal generative AI pipelines."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "PyJWT[crypto]>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "httpx>=0.27,<1", "ruff>=0.6,<1"]
image = ["torch>=2.3", "diffusers>=0.30", "transformers>=4.44", "accelerate>=0.34", "safetensors>=0.4", "Pillow>=10"]
worker = ["requests>=2.32,<3"]
postgres = ["asyncpg>=0.30,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-generative-ai"
version = "0.1.0"
description = "Modular API and orchestration layer for multimodal generative AI pipelines."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "PyJWT[crypto]>=2.9,<3",
  "httpx>=0.27,<1",
  "cryptography>=50,<51",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<7",
  "pytest-timeout>=2.3,<3",
  "hypothesis>=6.112,<7",
  "bandit>=1.8,<2",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]
image = ["torch>=2.3", "diffusers>=0.30", "transformers>=4.44", "accelerate>=0.34", "safetensors>=0.4", "Pillow>=10"]
worker = ["requests>=2.32,<3"]
postgres = ["asyncpg>=0.30,<1"]
mcp = ["mcp>=2.3.0,<3"]

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["app*", "ugai_decision*", "ugai_mcp*", "ugai_replication*", "ugai_workflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = [
  "e2e: staging-only end-to-end tests that require a real deployed API and agent worker",
  "security: negative-path and security regression tests",
  "performance: tests and tooling for controlled load/stress validation",
]

[tool.coverage.run]
branch = true
source = ["app", "ugai_decision", "ugai_mcp", "ugai_replication", "ugai_workflow"]
relative_files = true
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ugai-im19-connector"
version = "0.1.0"
description = "Fail-closed remote MCP client adapter for UGAI and IM19"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.3.0,<3.0.0"]
postgres-drive = ["asyncpg>=0.30,<1", "google-api-python-client>=2.150,<3"]
rag-migration = ["psycopg[binary]>=3.2,<4", "google-api-python-client>=2.150,<3", "google-auth>=2.35,<3", "cryptography>=44,<47"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "cryptography>=44,<47"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

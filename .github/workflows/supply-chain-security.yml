name: Supply Chain Security

on:
  pull_request:
  push:
    branches: ["main", "feature/**", "hardening/**"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install patched build tooling
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
      - name: Install application and audit tooling
        run: |
          pip install -e ".[dev,postgres,worker]"
          pip install pip-audit
      - name: Audit installed Python dependencies
        run: pip-audit

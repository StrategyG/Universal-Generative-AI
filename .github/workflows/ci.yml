name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ugenai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d ugenai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/ugenai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -e ".[dev,mcp,postgres,worker]"
      - name: Lint
        run: ruff check app src tests scripts
      - name: Static security analysis
        run: bandit -q -r app src -ll -x tests
      - name: Unit, integration and security tests with branch coverage
        run: >-
          pytest -q -m "not e2e"
          --cov=app
          --cov=ugai_decision
          --cov=ugai_mcp
          --cov=ugai_replication
          --cov=ugai_workflow
          --cov-branch
          --cov-report=term-missing
          --cov-report=json:coverage.json
      - name: Enforce critical module line and branch coverage
        run: python scripts/check_critical_coverage.py coverage.json
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.json
          if-no-files-found: ignore
          retention-days: 30

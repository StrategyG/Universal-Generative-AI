name: Platform Contract Conformance

on:
  pull_request:
    paths:
      - "contracts/v1/**"
      - "docs/contracts/**"
      - "tests/contracts/**"
      - "requirements-contracts.txt"
      - ".github/workflows/platform-contracts.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/v1/**"
      - "docs/contracts/**"
      - "tests/contracts/**"
      - "requirements-contracts.txt"
      - ".github/workflows/platform-contracts.yml"

permissions:
  contents: read

concurrency:
  group: platform-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-contracts.txt

      - name: Install pinned contract validator
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-contracts.txt

      - name: Validate schema JSON syntax
        run: python -m json.tool contracts/v1/platform-event.schema.json > /dev/null

      - name: Validate schema and golden fixtures
        run: python -m unittest discover -s tests/contracts -v

name: Platform Contract Schema
on:
  push:
    branches:
      - main
      - governance/cataran-platform-contracts-v1
  pull_request:
    paths:
      - "contracts/**"
      - "docs/contracts/**"
      - "tests/contracts/**"
      - "requirements-contracts.txt"
      - ".github/workflows/platform-contracts.yml"
permissions:
  contents: read
concurrency:
  group: platform-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned contract validator
        run: python -m pip install -r requirements-contracts.txt
      - name: Validate schema and golden fixtures
        run: python -m unittest discover -s tests/contracts -v

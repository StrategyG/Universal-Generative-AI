name: Knowledge Replication Contracts

on:
  pull_request:
    paths:
      - "src/ugai_replication/**"
      - "tests/test_replication_contracts.py"
      - "ops/knowledge_replication/**"
      - "pyproject.toml"
      - ".github/workflows/knowledge-replication-contracts.yml"
  push:
    branches:
      - "feature/postgres-gdrive-rag-migration-v1"

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test tools
        run: python -m pip install -e ".[dev]"
      - name: Lint replication package
        run: ruff check src/ugai_replication tests/test_replication_contracts.py
      - name: Test replication contracts
        run: pytest -q tests/test_replication_contracts.py

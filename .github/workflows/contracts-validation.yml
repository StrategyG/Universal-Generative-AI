name: Contract validation

on:
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/validate_contracts.py"
      - ".github/workflows/contracts-validation.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "scripts/validate_contracts.py"
      - ".github/workflows/contracts-validation.yml"

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract validators
        run: |
          python -m pip install --upgrade pip
          python -m pip install "jsonschema>=4.23,<5" "PyYAML>=6,<7" "openapi-spec-validator>=0.7,<1"
      - name: Validate JSON Schema and OpenAPI
        run: python scripts/validate_contracts.py

name: UGAI MCP and Decision Intelligence CI

on:
  pull_request:
    paths:
      - "src/ugai_mcp/**"
      - "src/ugai_decision/**"
      - "tests/test_im19_mcp_*.py"
      - "tests/test_decision_*.py"
      - "pyproject.toml"
      - ".github/workflows/im19-mcp-adapter.yml"

permissions:
  contents: read

jobs:
  adapter-and-decision-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[mcp,rag-migration,dev]"
      - name: Lint
        run: ruff check src/ugai_mcp src/ugai_decision tests/test_im19_mcp_*.py tests/test_decision_*.py tests/test_rag_migration_helpers.py
      - name: Unit tests
        run: pytest -q tests

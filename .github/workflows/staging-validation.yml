name: Staging E2E and Performance Validation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Staging validation suite"
        required: true
        type: choice
        options:
          - e2e
          - load
          - stress
        default: e2e

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ inputs.suite == 'e2e' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate staging credentials
        env:
          BASE_URL: ${{ secrets.RUSA_STAGING_BASE_URL }}
          BEARER_TOKEN: ${{ secrets.RUSA_STAGING_BEARER_TOKEN }}
          PROJECT_ID: ${{ secrets.RUSA_STAGING_PROJECT_ID }}
        run: |
          set -eu
          test -n "$BASE_URL" || (echo "Missing RUSA_STAGING_BASE_URL" >&2; exit 1)
          test -n "$BEARER_TOKEN" || (echo "Missing RUSA_STAGING_BEARER_TOKEN" >&2; exit 1)
          test -n "$PROJECT_ID" || (echo "Missing RUSA_STAGING_PROJECT_ID" >&2; exit 1)
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,mcp,postgres,worker]"
      - name: Run real user-to-agent lifecycle
        env:
          RUSA_E2E_BASE_URL: ${{ secrets.RUSA_STAGING_BASE_URL }}
          RUSA_E2E_BEARER_TOKEN: ${{ secrets.RUSA_STAGING_BEARER_TOKEN }}
          RUSA_E2E_PROJECT_ID: ${{ secrets.RUSA_STAGING_PROJECT_ID }}
          RUSA_E2E_WORKSPACE_ID: ${{ secrets.RUSA_STAGING_WORKSPACE_ID }}
          RUSA_E2E_TIMEOUT_SECONDS: "300"
        run: pytest -q -m e2e tests/e2e

  load:
    if: ${{ inputs.suite == 'load' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ secrets.RUSA_STAGING_BASE_URL }}
      AUTH_TOKEN: ${{ secrets.RUSA_STAGING_BEARER_TOKEN }}
      PROJECT_ID: ${{ secrets.RUSA_STAGING_PROJECT_ID }}
      WORKSPACE_ID: ${{ secrets.RUSA_STAGING_WORKSPACE_ID }}
      RPS: ${{ vars.RUSA_LOAD_RPS || '50' }}
      DURATION: ${{ vars.RUSA_LOAD_DURATION || '10m' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging credentials
        run: |
          set -eu
          test -n "$BASE_URL" || (echo "Missing RUSA_STAGING_BASE_URL" >&2; exit 1)
          test -n "$AUTH_TOKEN" || (echo "Missing RUSA_STAGING_BEARER_TOKEN" >&2; exit 1)
          test -n "$PROJECT_ID" || (echo "Missing RUSA_STAGING_PROJECT_ID" >&2; exit 1)
      - name: Run baseline load profile
        run: |
          docker run --rm \
            -e BASE_URL -e AUTH_TOKEN -e PROJECT_ID -e WORKSPACE_ID -e RPS -e DURATION \
            -v "$PWD:/work" -w /work \
            grafana/k6:0.54.0 run tests/performance/k6/load.js

  stress:
    if: ${{ inputs.suite == 'stress' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ secrets.RUSA_STAGING_BASE_URL }}
      AUTH_TOKEN: ${{ secrets.RUSA_STAGING_BEARER_TOKEN }}
      PROJECT_ID: ${{ secrets.RUSA_STAGING_PROJECT_ID }}
      WORKSPACE_ID: ${{ secrets.RUSA_STAGING_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging credentials
        run: |
          set -eu
          test -n "$BASE_URL" || (echo "Missing RUSA_STAGING_BASE_URL" >&2; exit 1)
          test -n "$AUTH_TOKEN" || (echo "Missing RUSA_STAGING_BEARER_TOKEN" >&2; exit 1)
          test -n "$PROJECT_ID" || (echo "Missing RUSA_STAGING_PROJECT_ID" >&2; exit 1)
      - name: Run controlled-overload stress profile
        run: |
          docker run --rm \
            -e BASE_URL -e AUTH_TOKEN -e PROJECT_ID -e WORKSPACE_ID \
            -v "$PWD:/work" -w /work \
            grafana/k6:0.54.0 run tests/performance/k6/stress.js
